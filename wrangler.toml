name = "rustcfml-site"
main = "build/worker/shim.mjs"
# Matches the reference worker host. Dates from 2026-08-04 enable nodejs_compat
# by default, but the flag is listed explicitly below, so a newer date buys
# nothing — and `wrangler dev` refuses any date its bundled runtime predates.
compatibility_date = "2026-05-25"
compatibility_flags = ["nodejs_compat"]

# A workers.dev URL for testing, alongside whatever custom domain is live.
workers_dev = true

# The apex. Cloudflare creates the DNS record and certificate for it on deploy,
# and points every path at this Worker; static assets above are still answered
# before the Worker runs. Add `zone_name = "rustcfml.org"` if a deploy cannot
# infer the zone.
[[routes]]
pattern = "rustcfml.org"
custom_domain = true

# www is attached to the same Worker only so it can answer at all: every
# request to it is redirected to the apex, which is what sitemap.xml and
# robots.txt name as canonical.
[[routes]]
pattern = "www.rustcfml.org"
custom_domain = true

# Static assets: anything present here is served directly, without invoking
# (or billing for) the Worker. Anything else falls through to the Worker,
# which is how the CFML pages get served. `public/` is generated by
# scripts/stage-assets.sh during the build below.
[assets]
directory = "./public"

[build]
# stage-assets    — copies assets/, robots.txt and sitemap.xml into public/.
# ESBUILD_BIN     — wrapper that forces --platform=node so the JSPI snippet's
#                   Node built-ins resolve under nodejs_compat.
# NO_MINIFY       — keeps wasm-bindgen identifiers readable for jspi-patch.mjs.
# worker-build    — pinned to match the `worker` crate: 0.8.5 passes
#                   --force-enable-abort-handler, which fails on this setup.
command = "sh scripts/stage-assets.sh && cargo install -q worker-build --version 0.8.3 && ESBUILD_BIN=$PWD/scripts/esbuild-wrapper.sh NO_MINIFY=1 worker-build --release && node jspi-patch.mjs"

# No KV, Durable Object, Hyperdrive or cron bindings: this site never touches
# session scope or a datasource, and its application scope is static config
# rebuilt by onApplicationStart in each isolate. Add them back from the
# reference host (RustCFML-Cloudflare-worker) if that stops being true.
